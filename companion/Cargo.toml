[package]
name = "companion"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = "0.35"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
lovense = { path = "../lovense" }
steamlocate = "2.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.9"
serde_json = "1"
dirs = "6"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
egui-phosphor = "0.13.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

